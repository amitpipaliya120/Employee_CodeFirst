<div class="app-container" [class.sidebar-collapsed]="isCollapsed">
  
  <div
    class="sidebar-backdrop"
    *ngIf="isMobileOpen"
    (click)="closeMobileSidebar()"
  ></div>

  
  <app-sidebar></app-sidebar>

  
  <div class="content-wrapper">
    
    <header class="top-navbar">
      <div class="d-flex align-items-center gap-2">
        
        <button
          type="button"
          class="btn btn-light border p-1 px-2 d-flex align-items-center justify-content-center navbar-sidebar-toggle"
          (click)="toggleSidebar()"
          title="Toggle Navigation Menu"
          aria-label="Toggle navigation menu"
        >
          <i class="bi bi-list fs-5"></i>
        </button>

        <span class="fw-bold text-dark fs-5 portal-title text-truncate">
          Employee Management Portal
        </span>
      </div>

      <div class="d-flex align-items-center gap-3">
        

        
        <div class="d-flex align-items-center gap-2 user-pill">
          <div
            class="avatar-circle-sm bg-primary text-white rounded-circle d-flex align-items-center justify-content-center"
            style="width: 34px; height: 34px; font-weight: 600;"
          >
            A
          </div>
          <span class="small fw-semibold text-secondary d-none d-sm-inline">Amit Pipaliya</span>
        </div>
      </div>
    </header>

    
    <main class="page-container">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<div class="toast-container-fixed">
  <div
    *ngFor="let toast of toasts"
    class="toast-custom text-white"
    [ngClass]="{
      'bg-success': toast.type === 'success',
      'bg-danger': toast.type === 'danger',
      'bg-warning text-dark': toast.type === 'warning',
      'bg-info text-dark': toast.type === 'info'
    }"
  >
    <div class="d-flex align-items-center me-3">
      <i
        class="bi me-2 fs-5"
        [ngClass]="{
          'bi-check-circle-fill': toast.type === 'success',
          'bi-exclamation-octagon-fill': toast.type === 'danger',
          'bi-exclamation-triangle-fill': toast.type === 'warning',
          'bi-info-circle-fill': toast.type === 'info'
        }"
      ></i>
      <span>{{ toast.message }}</span>
    </div>
    <button type="button" class="btn-close btn-close-white" (click)="closeToast(toast.id)"></button>
  </div>
</div>
